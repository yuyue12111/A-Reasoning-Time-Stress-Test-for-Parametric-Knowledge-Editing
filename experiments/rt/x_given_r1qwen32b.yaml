# EXPLORATORY (plan_2026-10-14 §3 Tier 1 item 3, pilot on seen items): where does thinking overrule the edit,
# in the chain's content or in the act of thinking?  Answer phase only, on supplied chains, R1-Distill-Qwen-32B,
# Study 2 32B pool (400 seen facts; no Study 3 fact).  Complements the registered G11' conditions in
# study2_r1qwen32b.yaml (rome_own, rome_filler, rome_swap: the edited model on its own chain, a length-matched
# " ." filler, another case's chain).  Never pooled with registered conditions; run tag s2x, own out_dir.
#   rome_given_base  edited model answers after the UNEDITED model's own B3 chain   (does the model's own knowledge,
#                    written into a chain, overrule an intact edit?)
#   base_own         unedited model re-fed its own chain (re-tokenization control for the base side)
#   base_filler      unedited model after a length-matched filler of its own chain (does content keep own answers?)
#   base_given_edit  unedited model after the EDITED model's B3 chain (does the edited chain carry the edit?)
# Same template, BOS rule, dtype, decoding and engine caps as study2_r1qwen32b.yaml.
model_tag: r1qwen32b
template: r1
no_bos: true
model:
  path: null
  dtype: bfloat16
  device_map: null
module_tmp: "model.layers.{}.mlp.down_proj"
out_dir: results/rt/s2x
run_tag: s2x

dataset:
  path: data/counterfact.jsonl
  manifest: experiments/rt/pools/study2/manifest_r1qwen32b.jsonl

aliases: data/aliases.json
probes: [efficacy]
decoding: {greedy: true}

engine:
  batch_size: 32
  max_batch_tokens: 128000
  answer_cap: 256
  chunk_cases: 10

conditions:
  - name: rome_given_base
    stage: 2
    editor: ROME
    target_tag: cf
    deltas_dir: deltas/r1qwen32b/ROME/cf
    budgets: [B0, GIVEN]
    given_chain: {source: "results/rt/s2/r1qwen32b_s2_base_r*of8.jsonl", condition: base,
                  budget: B3, probe: same, transform: own}
  - name: base_own
    stage: 2
    editor: none
    budgets: [B0, GIVEN]
    given_chain: {source: "results/rt/s2/r1qwen32b_s2_base_r*of8.jsonl", condition: base,
                  budget: B3, probe: same, transform: own}
  - name: base_filler
    stage: 2
    editor: none
    budgets: [B0, GIVEN]
    given_chain: {source: "results/rt/s2/r1qwen32b_s2_base_r*of8.jsonl", condition: base,
                  budget: B3, probe: same, transform: filler, filler_unit: " ."}
  - name: base_given_edit
    stage: 2
    editor: none
    budgets: [B0, GIVEN]
    given_chain: {source: "results/rt/s2/r1qwen32b_s2_rome_N_r*of8.jsonl", condition: rome_N,
                  budget: B3, probe: same, transform: own}
