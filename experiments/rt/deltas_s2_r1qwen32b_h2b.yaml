# Study 2, H2b prior-knowledge contrast (prereg-arr.md §5): ROME deltas for R1-Distill-Qwen-32B on the
# "unknown" group -- the first 300 candidates whose unedited base names neither value at B0
# (`rt.pool qualify`, h2b_unknown_k).  Same hparams and delta tree as the main run (case ids are
# disjoint); own log dir so the main run's shard logs stay one pool each.
model: r1qwen32b
editor: ROME
target_tag: cf
pool: experiments/rt/pools/study2/manifest_r1qwen32b_unknown.jsonl
dataset: data/counterfact.jsonl
models_file: experiments/rt/deltas_models.yaml
out_root: deltas
log_dir: results/rt/deltas_logs/s2_h2b
dtype: float32
factor:
  max_rank: 1
  tol: 1.0e-4
  floor_mult: 8.0
