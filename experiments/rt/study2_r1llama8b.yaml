# Study 2, R1-Distill-Llama-8B (REVISION.md §3; prereg-arr.md §3).
# Every model other than R1-Distill-Qwen-32B runs the unedited base and the ROME N arm at B0/B3 on
# its own frozen pool (rt.pool qualify).  Same row schema and engine as study2_r1qwen32b.yaml.
model_tag: r1llama8b
template: r1
no_bos: false                 # REVISION.md §5: Llama-based as in Study 1
model:
  path: null                  # null -> $WHYAAAI_MODEL
  dtype: bfloat16
  device_map: null
module_tmp: "model.layers.{}.mlp.down_proj"
out_dir: results/rt/s2
run_tag: s2

dataset:
  path: data/counterfact.jsonl
  manifest: experiments/rt/pools/study2/manifest_r1llama8b.jsonl

aliases: data/aliases.json
probes: [efficacy, para0, locality]
decoding: {greedy: true}

engine:
  batch_size: 64
  max_batch_tokens: 256000
  answer_cap: 256
  chunk_cases: 10

conditions:
  - name: base
    editor: none
    budgets: [B0, B3]
  - name: rome_N
    editor: ROME
    target_tag: cf
    deltas_dir: deltas/r1llama8b/ROME/cf
    budgets: [B0, B3]
