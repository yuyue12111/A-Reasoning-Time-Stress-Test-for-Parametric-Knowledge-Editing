# EXPLORATORY mechanism probes (rt.mech) on the STUDY 2 R1-Distill-Qwen-32B rome_N greedy B3 chains (400 seen facts).
# What each probe tests and the pre-declared readouts: experiments/rt/README_mech.md.
# Run from the project root on one H200 (32B bf16 = 64 GB of weights; forward passes only):
#   PYTHONPATH=src python -m rt.mech run --config experiments/rt/x_mech_s2_r1qwen32b.yaml \
#       --model $W/models/DeepSeek-R1-Distill-Qwen-32B
# Relative paths resolve against the working directory.

model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B   # platform: pass the local path with --model
model_tag: r1qwen32b          # must equal the delta records' model_tag
editor: ROME
target_tag: cf
dtype: bfloat16               # fp32 cross-check: --dtype float32 on 2×H200 (see README)
device_map: auto

# <case_id>.pt delta files written by rt.deltas for this pool (fp32 ROME, layer 12, o_new target).
deltas: deltas/r1qwen32b/ROME/cf
expect_target: o_new          # each delta's `target` must equal the case's o_new

# Study 2 engine-v2 rows with chains (fields case_id, budget, probe, decode, q, cot, answer); error rows
# carry no probe and are skipped.  results/rt/s2 is the registered H100 shard directory.
rows: "results/rt/s2/r1qwen32b_s2_rome_N_r*of8.jsonl"
probe: efficacy
decode: greedy
budgets: [B3]

cases: [data/counterfact.jsonl]
aliases: data/aliases.json
routes: null
route_cells: []

# Study 2 Qwen chains were generated without BOS (study2_r1qwen32b.yaml no_bos: true), so the
# teacher-forced context omits it as well.
bos: false

probes: [trace, gate]
masks: [none, all, question_only, chain_and_answer_only, answer_only, question_and_answer]
with_answer: true             # trace also covers the generated answer
trace_edit: true              # trace the edited model (identical to unedited for one-layer ROME)
alpha: 1.0
low: 0.5                      # activation threshold for "low" (a < 0.5) in readout (i)
gate_batch: null              # masks per forward pass; null = all six in one batch

out: results/rt/mech/s2_r1qwen32b_ROME_B3_r{rank}of{world}.jsonl
