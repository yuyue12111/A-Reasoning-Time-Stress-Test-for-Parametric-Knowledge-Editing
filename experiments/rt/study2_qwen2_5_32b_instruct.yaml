# Study 2, Qwen2.5-32B-Instruct (no reasoning post-training; prompted chain) (REVISION.md §3; prereg-arr.md §3).
# Every model other than R1-Distill-Qwen-32B runs the unedited base and the ROME N arm at B0/B3 on
# its own frozen pool (rt.pool qualify).  Same row schema and engine as study2_r1qwen32b.yaml.
model_tag: qwen2_5_32b_instruct
template: instruct_cot
no_bos: true                 # REVISION.md §5: Qwen-based as in Study 1; ChatML adds no BOS
model:
  path: null                  # null -> $WHYAAAI_MODEL
  dtype: bfloat16
  device_map: null
module_tmp: "model.layers.{}.mlp.down_proj"
out_dir: results/rt/s2
run_tag: s2

dataset:
  path: data/counterfact.jsonl
  manifest: experiments/rt/pools/study2/manifest_qwen2_5_32b_instruct.jsonl

aliases: data/aliases.json
probes: [efficacy, para0, locality]
decoding: {greedy: true}

engine:
  batch_size: 32
  max_batch_tokens: 128000
  answer_cap: 256
  chunk_cases: 10

conditions:
  - name: base
    editor: none
    budgets: [B0, B3]
  - name: rome_N
    editor: ROME
    target_tag: cf
    deltas_dir: deltas/qwen2_5_32b_instruct/ROME/cf
    budgets: [B0, B3]
