# capability 曲线 · Qwen-1.5B 低端锚(plan v1.28;头牌=capability-emergent)
# 复用 7B ROME hparams,只 override 尺寸字段(1.5B=28 层,末层 idx 27;hidden 1536)。
# 跑(1.5B 极小,4090 bf16 或 H200;编辑层起步 layer5,B0 ES 低再扫):
#   export WHYAAAI_MODEL=$W/models/DeepSeek-R1-Distill-Qwen-1.5B   # H200 再加 WHYAAAI_DTYPE=float32
#   for r in $(seq 0 7); do PYTHONPATH=source/EasyEdit python src/run_pilot.py --config experiments/probe_qwen1_5b.yaml --editor ROME --rank $r --world 8 --device $r & done; wait
#   python src/score_pilot.py --config experiments/probe_qwen1_5b.yaml --editor ROME
model_tag: r1qwen1_5b
seed: 42
out_dir: results/probe
hparams_overrides:
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B   # 离线用 WHYAAAI_MODEL=本地路径覆盖
  stats_dir: ./data/stats_r1qwen1_5b
  v_loss_layer: 27                                        # 1.5B=28 层
dataset:
  tag: cf200
  path: data/counterfact.prefiltered.jsonl
  fallback_path: data/counterfact.jsonl
  n: 200
budgets: [B0, B3]
probes: [efficacy, locality]   # 锚点只需 ES/CLR/RR(efficacy)+Loc(locality);砍 para/open 提速(与 8B/70B 同)
sampling:
  enabled: false
# 跑法(与旧 Qwen 7/14/32 同口径=无 BOS):export WHYAAAI_NO_BOS=1 再跑(BOS A/B 已证对 Qwen 无材料级影响,留此仅为严格一致)。
editors:
  ROME:
    hparams: source/EasyEdit/hparams/ROME/qwen2.5-7b.yaml
    layers: [5]        # 1.5B 起步(7B 同为 28 层、layer5);B0 ES 低再扫 {4,5,7}
