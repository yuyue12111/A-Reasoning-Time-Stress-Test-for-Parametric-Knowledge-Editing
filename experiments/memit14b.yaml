# B22 · MEMIT×CF 现象复制 · 14B；也是 X2 的 N 臂（权威既有结果）。
# 重要审计更正（plan v1.69）：权威 N 实跑层带是 [7,8,9]；旧注释/配置误写成五层
# [7,8,9,10,11]，不得用五层配置与既有 N 结果混配。X2 的 fresh-N/T/C 全部严格复用三层。
# 跑(H200 fp32 或 H100 bf16 皆可;14B 显存宽裕,求稳 fp32):
#   export WHYAAAI_MODEL=$W/models/DeepSeek-R1-Distill-Qwen-14B; export WHYAAAI_DTYPE=float32
#   # mom2 预热单进程 → 8 分片(命令同 memit32b.yaml,换 --config)
model_tag: r1qwen14b
seed: 42
out_dir: results/probe

hparams_overrides:
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
  stats_dir: ./data/stats_r1qwen14b
  v_loss_layer: 47                       # 14B=48 层,末层 idx 47

dataset:
  tag: cf200memit
  path: data/counterfact.prefiltered.jsonl
  fallback_path: data/counterfact.jsonl
  n: 200

budgets: [B0, B3]

sampling:
  enabled: false

probes: [efficacy, locality]

editors:
  MEMIT:
    hparams: source/EasyEdit/hparams/MEMIT/qwen2.5-7b.yaml
    layers: [7, 8, 9]                    # 权威 N 实跑层；X2 冻结，不扩层/不调参
