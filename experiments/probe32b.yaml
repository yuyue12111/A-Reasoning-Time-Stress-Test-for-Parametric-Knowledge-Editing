# 强推理器探针 · 32B (plan v1.23 ②；6/27 效应量决策点)
# RQ: 7B→14B→32B 真回忆 CLR / RR 是否单调上升(随能力 scaling = 这篇能否中 AAAI 的命门)?
# 设计同 14B(ROME-only，复用 7B hparams + override 尺寸字段，case 取 7B 预过滤前 100)。
# 跑(32B fp32 ~128G 须上 H200；Hopper bf16 ROME compute_v 必 NaN，故 WHYAAAI_DTYPE=float32)：
#   cd <项目根>
#   export WHYAAAI_MODEL=$W/models/DeepSeek-R1-Distill-Qwen-32B; export WHYAAAI_DTYPE=float32
#   for r in $(seq 0 7); do PYTHONPATH=source/EasyEdit python src/run_pilot.py \
#       --config experiments/probe32b.yaml --editor ROME --rank $r --world 8 --device $r & done; wait
#   python src/score_pilot.py --config experiments/probe32b.yaml --editor ROME
#   python src/audit_clr.py  --config experiments/probe32b.yaml --editor ROME --budget B3 --n 40
# 注: 32B fp32 单卡 ~128G/141G 偏紧，若 OOM 见 RUNBOOK(降 n 或单进程少卡)。

model_tag: r1qwen32b
seed: 42
out_dir: results/probe

hparams_overrides:
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B   # 离线平台用 WHYAAAI_MODEL=本地绝对路径覆盖
  stats_dir: ./data/stats_r1qwen32b
  v_loss_layer: 63                                       # 32B=64 层，末层 idx 63 (7B 是 27)

dataset:
  tag: cf200
  path: data/counterfact.prefiltered.jsonl   # 与 14B/7B 同序可比(前 200 = 7B 全集)
  fallback_path: data/counterfact.jsonl
  n: 200

budgets: [B0, B3]

sampling:
  enabled: false

editors:
  ROME:
    hparams: source/EasyEdit/hparams/ROME/qwen2.5-7b.yaml
    layers: [12]       # 32B 编辑层起步：64×0.18≈12；若 B0 ES_b 偏低再扫 {10,13,16}
