# E-SUP-BATTERY/W1 · D 臂 = 压 o_new(方向对照) · 32B (depth-plan.md)
# 与 headline T 臂(probe32b_sup.yaml,压 o_old)同 edit/同 200 case/同 scope=think/同 α=8,仅 suppress.source=o_new。
# 预注册:压 o_new 不应改善回退(ES@B3 不升、RR 不降);若反而改善=符号错=近致命,故 day-1 先验。
# 跑(H200 fp32,同 A2 单卡数据并行):
#   export WHYAAAI_MODEL=$W/models/DeepSeek-R1-Distill-Qwen-32B; export WHYAAAI_DTYPE=float32
#   for r in $(seq 0 7); do PYTHONPATH=source/EasyEdit python src/run_pilot.py --config experiments/probe32b_sup_onew.yaml --editor ROME --rank $r --world 8 --device $r & done; wait
#   # 然后 cross_arm 与 N(cf200)/T(cf200sup)配对
model_tag: r1qwen32b
seed: 42
out_dir: results/probe

hparams_overrides:
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  stats_dir: ./data/stats_r1qwen32b
  v_loss_layer: 63

dataset:
  tag: cf200sup_onew           # 同 200 case(同 path/seed),输出名区别于 T 臂 cf200sup
  path: data/counterfact.prefiltered.jsonl
  fallback_path: data/counterfact.jsonl
  n: 200

budgets: [B0, B3]

sampling:
  enabled: false

probes: [efficacy, locality]   # 跨臂统计只需 efficacy;locality 守门

suppress:
  penalty: 8
  scope: think
  source: o_new                # ★方向对照:压编辑值而非旧值

editors:
  ROME:
    hparams: source/EasyEdit/hparams/ROME/qwen2.5-7b.yaml
    layers: [12]
