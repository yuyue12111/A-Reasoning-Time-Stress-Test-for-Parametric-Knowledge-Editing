# X3/C · ROME-32B active-paraphrase 同 relation 强竞争者对照（prereg-x2-x3.md）。
# 与 X3/T 仅 source/供体不同；主端点 T−C PS@B3，C−N 同时作惰性守门。
model_tag: r1qwen32b
seed: 42
out_dir: results/probe

hparams_overrides:
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  stats_dir: ./data/stats_r1qwen32b
  v_loss_layer: 63
  model_parallel: true

dataset:
  tag: cf200para_strong_mp2
  path: data/counterfact.prefiltered.jsonl
  fallback_path: data/counterfact.jsonl
  n: 200

budgets: [B0, B3]
sampling:
  enabled: false
probes: [efficacy, paraphrase]

suppress:
  penalty: 8
  scope: think
  source: placebo
  placebo_map: data/placebo_donors_strong.json
  apply_to: [efficacy, para0, para1]

editors:
  ROME:
    hparams: source/EasyEdit/hparams/ROME/qwen2.5-7b.yaml
    layers: [12]
