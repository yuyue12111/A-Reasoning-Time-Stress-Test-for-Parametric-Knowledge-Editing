# Pilot 配置 (plan Phase 1, 6/22 go/no-go)。
# 跑法 (每卡一进程，8 卡)：
#   cd source/EasyEdit
#   for r in $(seq 0 7); do
#     PYTHONPATH=. python ../../src/run_pilot.py --config ../../experiments/pilot.yaml \
#       --editor ROME --rank $r --world 8 &
#   done; wait
# 先跑预过滤 (§2.3，生成 dataset.path)：
#   PYTHONPATH=. python ../../src/prefilter.py --config ../../experiments/pilot.yaml

model_tag: r1qwen7b
seed: 42
out_dir: results/pilot

# 覆盖 EasyEdit qwen2.5-7b.yaml 里不适用于我们主模型的字段（run_pilot 注入到 hparams）
hparams_overrides:
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B   # 原 yaml 指向 ./hugging_cache/Qwen2.5-7B
  stats_dir: ./data/stats_r1qwen                         # 与 Qwen2.5 mom2 分目录 (01 笔记雷点 4)

dataset:
  tag: cf200
  path: data/counterfact.prefiltered.jsonl   # 预过滤产物 (src/prefilter.py)
  fallback_path: data/counterfact.jsonl      # 没预过滤就回退到清洗后全量 (会打警告)
  n: 200                                      # 抽样数

budgets: [B0, B3, B4]    # plan Phase 1 的 {0, natural≈B3(cap8192), extend=B4}

# 解码臂 (plan §2.5「每条 greedy + temperature 0.6 × 3 seeds」)。
# 首窗 greedy 先行 (sumandplan §6.3：结论须在 greedy 下成立)，故 enabled 默认 false。
# 开采样：enabled=true → 每 (case,budget,probe) 额外产出 len(seeds) 行 decode=sample（jsonl 记 seed/temperature）。
sampling:
  enabled: false
  temperature: 0.6
  seeds: [0, 1, 2]

editors:
  ROME:
    hparams: source/EasyEdit/hparams/ROME/qwen2.5-7b.yaml
    layers: [5]              # plan §7 待扫 {[4-8],[6-10],[8-12]}；先用 EasyEdit 默认起步
  MEMIT:
    hparams: source/EasyEdit/hparams/MEMIT/qwen2.5-7b.yaml
    layers: [4, 5, 6, 7, 8]

# 待办（接线/算卡时）：
# - layers 扫描：在 Locality≥85% 前提下取生成式 B0 ES 最高层（plan v1.18/§7；旧 ES≥90% 是 rewrite_acc 数字误植）
# - 采样臂已就位（上方 sampling 块，默认 greedy）；开窗补跑 0.6×3 时把 enabled 设 true
# - 预算档已定 5 档 B0–B4 (plan v1.12, 用户取 B)；pilot 用 B0/B3/B4
